<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Registration Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #001a33;
            color: white;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        .corridor {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, #00ccff, #006699);
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .corridor::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(0,0,0,0.2) 1px, transparent 1px) 0 0 / 40px 100%,
                linear-gradient(0deg, rgba(0,0,0,0.2) 1px, transparent 1px) 0 0 / 100% 40px;
            transform: rotateX(60deg);
            transform-origin: center bottom;
            animation: grid 10s linear infinite;
        }

        @keyframes grid {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            background: repeating-linear-gradient(90deg, 
                rgba(0, 180, 255, 0.8) 0px, 
                rgba(0, 180, 255, 0.8) 40px, 
                rgba(0, 60, 120, 0.8) 40px, 
                rgba(0, 60, 120, 0.8) 80px);
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center bottom;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.6);
        }

        .side-lights {
            position: absolute;
            right: 0;
            height: 100%;
            width: 10%;
            background: linear-gradient(90deg, 
                rgba(255, 180, 0, 0), 
                rgba(255, 180, 0, 0.4));
        }

        .registration-container {
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 30px;
            width: 60%;
            max-width: 400px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 150, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.5);
            z-index: 10;
        }

        .logo-circle {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.5);
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-banner {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ff00cc, #3300ff);
            padding: 10px 30px;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid yellow;
            z-index: 5;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        p {
            text-align: center;
            margin-bottom: 20px;
            color: #cccccc;
        }

        .checkmark {
            display: block;
            width: 40px;
            height: 40px;
            margin: 10px auto;
            background-color: rgba(0, 200, 255, 0.2);
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            font-size: 24px;
            color: white;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 150, 255, 0.5);
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder,
        input[type="email"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            display: block;
            width: 50%;
            margin: 20px auto;
            padding: 10px;
            background: rgba(0, 100, 255, 0.3);
            border: 1px solid rgba(0, 150, 255, 0.8);
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: rgba(0, 150, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 200, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="corridor">
        <div class="floor"></div>
        <div class="side-lights"></div>  
        <div class="header-banner">
            Welcome to world of sci-fic of story
        </div>
        
        <div class="registration-container">
            <h1>SIGN UP</h1>
            <p>Registration is free and easy</p>
            <div class="checkmark">✓</div>
            
            <form>
                <input type="email" placeholder="Enter your Email" required>
                <input type="password" placeholder="Enter your Password" required>
           <button type="submit"><a href="2.html">REGISTER</a></button>
            </form>
        </div>
    </div>
</body>
</html>
